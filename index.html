<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة ليكي 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 25px;
    padding: 50px 35px;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    animation: pop 0.8s ease;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .heart {
    font-size: 60px;
    animation: beat 1.2s infinite;
    display: inline-block;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }
  h1 {
    color: #d6336c;
    font-size: 28px;
    margin: 15px 0 25px;
  }
  p {
    color: #444;
    font-size: 18px;
    line-height: 2;
    margin-bottom: 15px;
  }
  .signature {
    margin-top: 30px;
    color: #d6336c;
    font-weight: bold;
    font-size: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">💖</div>
    <h1>أنا آسف</h1>
    <p>حقك عليّا يا <strong>my sugar</strong> 🍬</p>
    <p>وبحبك عفكرة...ومتزعليش مني انا مقصدش ادايقك او يكون في بينا زعل.</p>
    <p>سامحيني؟ 🥺</p>
    <div class="signature">— بحبك يمراتيي ❤️</div>
  </div>
</body>
</html>
